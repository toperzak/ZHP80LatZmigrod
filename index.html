<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Harcerzy ZHP Żmigród</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; margin: 0; background-color: #f4f4f4; color: #333; }
        .container { max-width: 800px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #006400; }
        p { text-align: center; color: #555; }
        form, #search-section { margin-bottom: 30px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
        button { display: block; width: 100%; background: #006400; color: #fff; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #004d00; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #006400; color: white; }
        #search-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        /* Kluczowa reguła - tabela jest na starcie niewidoczna */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wyszukiwarka Harcerzy ZHP Żmigród</h1>
        <p>Z okazji 80-lecia ZHP w Żmigrodzie, odnajdźmy się na nowo!</p>

        <div id="form-section">
            <h2>Dodaj siebie do bazy</h2>
            <form id="scout-form">
                <label for="pseudonim">Pseudonim:</label>
                <input type="text" id="pseudonim" name="pseudonim" required>
                <label for="lata-sluzby">Lata służby (np. 1990-1995):</label>
                <input type="text" id="lata-sluzby" name="lata-sluzby" required>
                <label for="druzyna">Nazwa drużyny:</label>
                <input type="text" id="druzyna" name="druzyna" required>
                <label for="zastep">Nazwa zastępu:</label>
                <input type="text" id="zastep" name="zastep">
                <button type="submit">Dodaj do bazy</button>
            </form>
        </div>

        <div id="search-section">
            <h2>Wyszukaj znajomych</h2>
            <p>Wpisz co najmniej jedną informację, aby rozpocząć wyszukiwanie.</p>
            <div id="search-inputs">
                <input type="text" id="search-pseudonim" placeholder="Szukaj po pseudonimie...">
                <input type="text" id="search-rok" placeholder="Szukaj po roku służby...">
                <input type="text" id="search-druzyna" placeholder="Szukaj po drużynie...">
                <input type="text" id="search-zastep" placeholder="Szukaj po zastępie...">
            </div>
        </div>

        <table id="scouts-table" class="hidden">
            <thead>
                <tr>
                    <th>Pseudonim</th>
                    <th>Lata służby</th>
                    <th>Drużyna</th>
                    <th>Zastęp</th>
                </tr>
            </thead>
            <tbody id="scouts-table-body">
                </tbody>
        </table>
        <p id="no-results" class="hidden">Brak wyników spełniających podane kryteria.</p>
    </div>

    <script>
        const sheetURL = 'https://script.google.com/macros/s/AKfycbxjRjmwwFJMG39Ri73NMf4gYLcbG03YT9m7wey2DIo0fuMz4KuXqtJ0IDo9j2Zy6aq0/exec';
        
        const form = document.getElementById('scout-form');
        const table = document.getElementById('scouts-table');
        const tableBody = document.getElementById('scouts-table-body');
        const noResultsMessage = document.getElementById('no-results');

        const searchInputs = [
            document.getElementById("search-pseudonim"),
            document.getElementById("search-rok"),
            document.getElementById("search-druzyna"),
            document.getElementById("search-zastep")
        ];
        
        let allScoutsData = []; // Zmienna do przechowywania wszystkich danych w pamięci

        // --- 1. POBIERANIE DANYCH ---
        async function loadData() {
            try {
                const response = await fetch(sheetURL);
                if (!response.ok) throw new Error('Błąd sieci lub niepoprawny adres URL.');
                
                const data = await response.json();
                allScoutsData = data; // Zapisujemy dane globalnie
                console.log("Dane załadowane pomyślnie:", allScoutsData.length, "wpisów.");
            } catch (error) {
                console.error('KRYTYCZNY BŁĄD podczas ładowania danych:', error);
                alert('Nie udało się załadować danych z bazy. Sprawdź, czy adres URL jest poprawny i czy skrypt jest prawidłowo wdrożony. Więcej informacji w konsoli (F12).');
            }
        }
        
        // --- 2. LOGIKA FILTROWANIA I WYŚWIETLANIA ---
        function handleSearch() {
            const filters = {
                pseudonim: searchInputs[0].value.toUpperCase(),
                rok: searchInputs[1].value,
                druzyna: searchInputs[2].value.toUpperCase(),
                zastep: searchInputs[3].value.toUpperCase()
            };

            const isAnyFilterActive = Object.values(filters).some(val => val !== '');
            
            if (!isAnyFilterActive) {
                table.classList.add('hidden');
                noResultsMessage.classList.add('hidden');
                return;
            }

            const filteredData = allScoutsData.filter(scout => {
                // Filtr roku
                let rokMatch = true;
                if (filters.rok) {
                    const searchYear = parseInt(filters.rok, 10);
                    if (!isNaN(searchYear)) {
                        const yearsInCell = (scout.lataSluzby.match(/\d{4}/g) || []).map(Number);
                        if (yearsInCell.length === 1) {
                            rokMatch = (searchYear === yearsInCell[0]);
                        } else if (yearsInCell.length >= 2) {
                            rokMatch = (searchYear >= yearsInCell[0] && searchYear <= yearsInCell[1]);
                        } else {
                            rokMatch = false;
                        }
                    } else { // Wyszukiwanie tekstowe jeśli nie jest liczbą
                        rokMatch = scout.lataSluzby.toUpperCase().includes(filters.rok.toUpperCase());
                    }
                }

                // Pozostałe filtry
                const pseudonimMatch = scout.pseudonim.toUpperCase().includes(filters.pseudonim);
                const druzynaMatch = scout.druzyna.toUpperCase().includes(filters.druzyna);
                const zastepMatch = scout.zastep.toUpperCase().includes(filters.zastep);

                return pseudonimMatch && rokMatch && druzynaMatch && zastepMatch;
            });

            // Aktualizacja tabeli w DOM
            tableBody.innerHTML = ''; // Czyścimy tabelę

            if (filteredData.length > 0) {
                table.classList.remove('hidden');
                noResultsMessage.classList.add('hidden');
                filteredData.forEach(scout => {
                    const row = tableBody.insertRow();
                    row.insertCell().textContent = scout.pseudonim;
                    row.insertCell().textContent = scout.lataSluzby;
                    row.insertCell().textContent = scout.druzyna;
                    row.insertCell().textContent = scout.zastep;
                });
            } else {
                table.classList.add('hidden');
                noResultsMessage.classList.remove('hidden');
            }
        }

        // --- 3. OBSŁUGA FORMULARZA ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await fetch(sheetURL, { method: 'POST', body: new FormData(form) });
                alert('Dodano do bazy! Nowe dane będą dostępne po chwili.');
                form.reset();
                setTimeout(loadData, 2000); // Odśwież dane w tle
            } catch (error) {
                console.error('Błąd podczas wysyłania formularza:', error);
                alert('Wystąpił błąd podczas dodawania wpisu.');
            }
        });

        // --- 4. START APLIKACJI ---
        // Dodajemy nasłuchiwanie na zdarzenie 'input' do każdego pola wyszukiwania
        searchInputs.forEach(input => input.addEventListener('input', handleSearch));
        
        // Ładujemy dane przy starcie strony
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
